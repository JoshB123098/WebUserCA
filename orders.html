<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Orders - Student Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#f5f3ee;
--surface:#ffffff;
--accent:#2a6049;
--text:#1a1a18;
--muted:#6b6b60;
--border:#dddbd3;
--danger:#c0392b;
--radius:12px;
--shadow:0 2px 16px rgba(0,0,0,0.07);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
header{background:var(--accent);color:#fff;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;}
.logo{font-family:'Syne';font-weight:800;font-size:1.2rem}
.logo span{opacity:.6;font-weight:400}
nav a{color:rgba(255,255,255,.75);text-decoration:none;margin-left:1.5rem;font-size:.9rem}
nav a.active,nav a:hover{color:#fff}

/* MAIN */
main{max-width:900px;margin:auto;padding:2rem}
h2{font-family:'Syne';font-size:1.6rem;margin-bottom:.3rem}
.subtitle{color:var(--muted);font-size:.9rem;margin-bottom:2rem}

/* FORM */
.form-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:2rem;box-shadow:var(--shadow);display:none}
.form-box h3{font-family:'Syne';margin-bottom:1rem;color:var(--accent)}
.form-box input{display:block;width:100%;padding:.65rem;margin-bottom:.75rem;border:1px solid var(--border);border-radius:8px;font-family:'DM Sans';font-size:.95rem}
.form-box input:focus{outline:none;border-color:var(--accent)}
.btn-row{display:flex;gap:.75rem}

/* BUTTONS */
.btn{padding:.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer;font-family:'DM Sans';font-size:.9rem}
.btn-green{background:var(--accent);color:#fff}
.btn-green:hover{background:#1f4d38}
.btn-grey{background:#999;color:#fff}
.btn-add{background:var(--accent);color:#fff;margin-bottom:1.5rem}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;box-shadow:var(--shadow)}
.card-id{font-size:.75rem;color:var(--muted);margin-bottom:.5rem}
.card-name{font-family:'Syne';font-size:1.1rem;font-weight:700;margin-bottom:.75rem}
.card-row{display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted);margin-bottom:.4rem}
.card-row span{color:var(--text);font-weight:500}
.card-actions{display:flex;gap:.5rem;margin-top:1rem;padding-top:.75rem;border-top:1px solid var(--border)}
.btn-edit{background:#e8f2ee;color:var(--accent);border:1px solid #c4ddd5;padding:.4rem .9rem;border-radius:6px;cursor:pointer;font-size:.82rem}
.btn-edit:hover{background:#d2ece4}
.btn-del{background:transparent;color:var(--danger);border:1px solid var(--danger);padding:.4rem .9rem;border-radius:6px;cursor:pointer;font-size:.82rem}
.btn-del:hover{background:#fdecea}

/* EMPTY */
.empty{text-align:center;padding:3rem;color:var(--muted)}

/* FOOTER */
footer{background:var(--text);color:rgba(255,255,255,.6);text-align:center;padding:1.5rem;font-size:.85rem;margin-top:3rem}
footer span{color:#fff}
</style>
</head>
<body>

<header>
  <div class="logo">Student<span>Shop</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="categories.html">Categories</a>
    <a href="products.html">Products</a>
    <a href="orders.html" class="active">Orders</a>
  </nav>
</header>

<main>
  <h2>Orders</h2>
  <p class="subtitle">View and manage all customer orders</p>

  <button class="btn btn-add" onclick="showForm()">+ Add Order</button>

  <!-- FORM -->
  <div class="form-box" id="form-box">
    <h3 id="form-title">New Order</h3>
    <input type="hidden" id="edit-id"/>
    <input id="inp-name" placeholder="Customer Name"/>
    <input id="inp-product" type="number" placeholder="Product ID"/>
    <input id="inp-quantity" type="number" placeholder="Quantity"/>
    <input id="inp-price" type="number" step="0.01" placeholder="Total Price (€)"/>
    <div class="btn-row">
      <button class="btn btn-green" onclick="addOrder()">Save Order</button>
      <button class="btn btn-grey" onclick="cancelForm()">Cancel</button>
    </div>
  </div>

  <!-- CARDS -->
  <div class="cards" id="order-cards">
    <p class="empty">Loading orders...</p>
  </div>
</main>

<footer>
  Built by students at <span>TU Dublin</span> — Web User Experience and Database Design
</footer>

<script>
const SUPABASE_URL="https://rgqyweaxmsyqwhutdqaa.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJncXl3ZWF4bXN5cXdodXRkcWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMTE3MjEsImV4cCI6MjA4NTY4NzcyMX0.Kez-WwuJRusuQiGSL0pVQze4Qq-j-P0USQtjsk8c6uY";

// Load all orders from Supabase
async function load(){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/orders?order=id.asc`,{
    headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}
  });
  const data=await res.json();
  displayOrders(data);
}

// Display orders as cards
function displayOrders(data){
  const container=document.getElementById("order-cards");
  if(data.length===0){
    container.innerHTML='<p class="empty">No orders yet. Add your first one!</p>';
    return;
  }
  container.innerHTML=data.map(o=>`
    <div class="card">
      <div class="card-id">Order #${o.id}</div>
      <div class="card-name">${o.customer_name}</div>
      <div class="card-row">Product ID: <span>${o.product_id}</span></div>
      <div class="card-row">Quantity: <span>${o.quantity}</span></div>
      <div class="card-row">Total: <span>€${parseFloat(o.total_price).toFixed(2)}</span></div>
      <div class="card-actions">
        <button class="btn-edit" onclick="editOrder(${o.id},'${o.customer_name}',${o.product_id},${o.quantity},${o.total_price})">Edit</button>
        <button class="btn-del" onclick="deleteOrder(${o.id})">Delete</button>
      </div>
    </div>
  `).join("");
}

// Add new order or update existing
async function addOrder(){
  const name=document.getElementById("inp-name").value.trim();
  const product=document.getElementById("inp-product").value.trim();
  const quantity=document.getElementById("inp-quantity").value.trim();
  const price=document.getElementById("inp-price").value.trim();
  const editId=document.getElementById("edit-id").value;

  if(!name||!product||!quantity||!price){alert("Please fill in all fields");return;}

  if(editId){
    await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${editId}`,{
      method:"PATCH",
      headers:{"Content-Type":"application/json",apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`},
      body:JSON.stringify({customer_name:name,product_id:parseInt(product),quantity:parseInt(quantity),total_price:parseFloat(price)})
    });
  }else{
    await fetch(`${SUPABASE_URL}/rest/v1/orders`,{
      method:"POST",
      headers:{"Content-Type":"application/json",apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`},
      body:JSON.stringify({customer_name:name,product_id:parseInt(product),quantity:parseInt(quantity),total_price:parseFloat(price)})
    });
  }
  cancelForm();
  load();
}

// Fill form for editing
function editOrder(id,name,product,quantity,price){
  document.getElementById("edit-id").value=id;
  document.getElementById("inp-name").value=name;
  document.getElementById("inp-product").value=product;
  document.getElementById("inp-quantity").value=quantity;
  document.getElementById("inp-price").value=price;
  document.getElementById("form-title").textContent="Edit Order";
  document.getElementById("form-box").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}

// Delete order
async function deleteOrder(id){
  if(!confirm("Delete this order?"))return;
  await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${id}`,{
    method:"DELETE",
    headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}
  });
  load();
}

function showForm(){
  document.getElementById("form-title").textContent="New Order";
  document.getElementById("form-box").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}

function cancelForm(){
  document.getElementById("edit-id").value="";
  document.getElementById("inp-name").value="";
  document.getElementById("inp-product").value="";
  document.getElementById("inp-quantity").value="";
  document.getElementById("inp-price").value="";
  document.getElementById("form-title").textContent="New Order";
  document.getElementById("form-box").style.display="none";
}

load();
</script>
</body>
</html>
