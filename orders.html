<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Orders - Student Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#f5f3ee;
--surface:#ffffff;
--accent:#2a6049;
--accent-light:#e8f2ee;
--text:#1a1a18;
--muted:#6b6b60;
--border:#dddbd3;
--danger:#c0392b;
--radius:12px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--accent);color:#fff;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;}
.logo{font-family:'Syne';font-weight:800}
.logo span{opacity:.6}
nav a{color:rgba(255,255,255,.75);text-decoration:none;margin-left:1.5rem}
nav a.active,nav a:hover{color:#fff}
main{max-width:1000px;margin:auto;padding:2rem}
.page-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:2rem}
.page-header h1{font-family:'Syne';font-size:2rem}
.page-header span{display:block;font-size:.9rem;color:var(--muted)}
.btn{padding:.6rem 1.2rem;border-radius:8px;border:none;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}
.btn-danger{border:1px solid var(--danger);color:var(--danger);background:transparent}
.btn-edit{background:var(--accent-light);color:var(--accent);border:1px solid var(--border);padding:.4rem .8rem;border-radius:6px;cursor:pointer}
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:2rem;display:none;}
.form-group{margin-bottom:1rem}
.form-group input{width:100%;padding:.6rem;border:1px solid var(--border);border-radius:6px;}
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:.8rem;border-bottom:1px solid #eee;text-align:left}
th{font-size:.8rem;color:var(--muted)}
.actions{display:flex;gap:.5rem}
footer{background:#1a1a18;color:rgba(255,255,255,.6);text-align:center;padding:2rem;font-size:.88rem;margin-top:3rem}
footer span{color:#fff}
</style>
</head>
<body>

<header>
<div class="logo">Student<span>Shop</span></div>
<nav>
<a href="index.html">Home</a>
<a href="categories.html">Categories</a>
<a href="products.html">Products</a>
<a href="orders.html" class="active">Orders</a>
<a href="users.html">Users</a>
</nav>
</header>

<main>
<div class="page-header">
<h1>Orders<span>Manage customer orders</span></h1>
<button class="btn btn-primary" onclick="showForm()">+ Add Order</button>
</div>

<div class="form-card" id="form">
<h3 style="margin-bottom:1rem;color:var(--accent)">New Order</h3>
<input type="hidden" id="edit-id"/>
<div class="form-group"><input id="inp-name" placeholder="Customer Name"></div>
<div class="form-group"><input id="inp-product" type="number" placeholder="Product ID"></div>
<div class="form-group"><input id="inp-quantity" type="number" placeholder="Quantity"></div>
<div class="form-group"><input id="inp-price" type="number" placeholder="Total Price (€)"></div>
<button class="btn btn-primary" onclick="addOrder()">Save</button>
<button class="btn" style="background:#ccc;margin-left:.5rem" onclick="hideForm()">Cancel</button>
</div>

<div class="table-card">
<table>
<thead>
<tr>
<th>ID</th>
<th>Customer Name</th>
<th>Product ID</th>
<th>Quantity</th>
<th>Total Price</th>
<th>Date</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>
</main>

<footer>
Built by students at <span>TU Dublin</span> - Web User Experience and Database Design | Orders by Yaqeen
</footer>

<script>
const SUPABASE_URL="https://rgqyweaxmsyqwhutdqaa.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJncXl3ZWF4bXN5cXdodXRkcWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMTE3MjEsImV4cCI6MjA4NTY4NzcyMX0.Kez-WwuJRusuQiGSL0pVQze4Qq-j-P0USQtjsk8c6uY";

async function load(){
const res=await fetch(`${SUPABASE_URL}/rest/v1/orders?order=id.asc`,{
headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}
});
const data=await res.json();
render(data);
}

function render(data){
const el=document.getElementById("list");
if(data.length===0){
el.innerHTML='<tr><td colspan="7" style="text-align:center;padding:2rem">No orders yet.</td></tr>';
return;
}
el.innerHTML=data.map(o=>`
<tr>
<td>${o.id}</td>
<td>${o.customer_name}</td>
<td>${o.product_id}</td>
<td>${o.quantity}</td>
<td>€${parseFloat(o.total_price).toFixed(2)}</td>
<td>${o.created_at ? new Date(o.created_at).toLocaleDateString('en-IE') : 'N/A'}</td>
<td class="actions">
<button class="btn-edit" onclick="editOrder(${o.id},'${o.customer_name}',${o.product_id},${o.quantity},${o.total_price})">Edit</button>
<button class="btn btn-danger" onclick="del(${o.id})">Delete</button>
</td>
</tr>`).join('');
}

async function addOrder(){
const name=document.getElementById("inp-name").value;
const product=document.getElementById("inp-product").value;
const quantity=document.getElementById("inp-quantity").value;
const price=document.getElementById("inp-price").value;
const editId=document.getElementById("edit-id").value;
if(!name||!product||!quantity||!price){alert("Fill all fields");return;}
if(editId){
await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${editId}`,{
method:"PATCH",
headers:{"Content-Type":"application/json",apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`},
body:JSON.stringify({customer_name:name,product_id:parseInt(product),quantity:parseInt(quantity),total_price:parseFloat(price)})
});
}else{
await fetch(`${SUPABASE_URL}/rest/v1/orders`,{
method:"POST",
headers:{"Content-Type":"application/json",apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`},
body:JSON.stringify({customer_name:name,product_id:parseInt(product),quantity:parseInt(quantity),total_price:parseFloat(price)})
});
}
hideForm();
load();
}

function editOrder(id,name,product,quantity,price){
document.getElementById("edit-id").value=id;
document.getElementById("inp-name").value=name;
document.getElementById("inp-product").value=product;
document.getElementById("inp-quantity").value=quantity;
document.getElementById("inp-price").value=price;
document.getElementById("form").style.display="block";
}

async function del(id){
if(!confirm("Delete this order?"))return;
await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${id}`,{
method:"DELETE",
headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}
});
load();
}

function showForm(){
document.getElementById("form").style.display="block";
}

function hideForm(){
document.getElementById("edit-id").value="";
document.getElementById("inp-name").value="";
document.getElementById("inp-product").value="";
document.getElementById("inp-quantity").value="";
document.getElementById("inp-price").value="";
document.getElementById("form").style.display="none";
}

load();
</script>
</body>
</html>
